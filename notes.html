    function getSubjectsForNotesSemester(semester) {
      const semNum = Number(semester);

      if (semNum === 1 || semNum === 2) {
        const branchEntry = branchYear1SemesterSubjects[selectedBranch] || branchYear1SemesterSubjects['cse'];
        return branchEntry[semNum] || semesterSubjects[semNum];
      }

        const branchEntry = branchYear2SemesterSubjects[selectedBranch] || branchYear2SemesterSubjects['cse'];
        return branchEntry[semNum] || semesterSubjects[semNum];
      }

      return semesterSubjects[semNum] || [];
    }

    } else if (selectedSemester) {
      const semSubjects = getSubjectsForNotesSemester(selectedSemester);
      desc.textContent = `Showing Semester ${selectedSemester} ${resourceLabel} subjects.`;
    }

    const visibleSubjects = selectedSubject && data[selectedSubject]
      ? [selectedSubject]
      : selectedSemester
        ? getSubjectsForNotesSemester(selectedSemester)
        : Object.keys(data);


    visibleSubjects.forEach(subject => {
      const row = document.createElement('div');
      row.className = 'resource-row' + (subject === selectedSubject ? ' selected' : '');

      const name = document.createElement('div');
      name.className = 'resource-name';
      name.textContent = subject;

      const action = document.createElement('div');
      action.className = 'resource-action';

      const item = data[subject];
      if (!item || !item.file) {
        const label = document.createElement('span');
        label.className = 'download-missing';
        label.textContent = 'Coming soon';
        action.appendChild(label);
      } else {
        const button = document.createElement('a');
        button.href = item.file;
        button.textContent = `Download ${resourceLabel}`;
        button.className = 'download-btn';
        button.setAttribute('download', item.file);
        action.appendChild(button);
      }

      row.appendChild(name);
      row.appendChild(action);
      table.appendChild(row);
